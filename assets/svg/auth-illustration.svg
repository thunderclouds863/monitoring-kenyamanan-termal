<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none" role="img" aria-label="Ilustrasi arsitektur pemantauan kenyamanan termal ruangan">
  <defs>
    <linearGradient id="bgGlow" x1="60" y1="30" x2="500" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1628" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="115" y1="88" x2="445" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#132640"/>
    </linearGradient>
    <linearGradient id="roomGrad" x1="140" y1="168" x2="420" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13263E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D1B2E" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="airflow1" x1="88" y1="226" x2="465" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1"/>
      <stop offset="45%" stop-color="#14B8A6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="airflow2" x1="100" y1="276" x2="450" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="comfortCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#14B8A6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient climate rings -->
  <circle cx="280" cy="245" r="185" fill="url(#bgGlow)"/>
  <circle cx="280" cy="245" r="158" stroke="#14B8A6" stroke-opacity="0.14" stroke-dasharray="5 7" stroke-width="1.2"/>
  <circle cx="280" cy="245" r="118" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Ground baseline -->
  <line x1="68" y1="354" x2="492" y2="354" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="104" y1="364" x2="456" y2="364" stroke="#1E293B" stroke-width="1" stroke-linecap="round"/>

  <!-- Compact Tropical House Cross-Section -->
  <!-- Main structure -->
  <rect x="136" y="166" width="288" height="188" rx="6" fill="url(#roomGrad)" stroke="#334155" stroke-width="1.8"/>

  <!-- Pitched overhanging roof -->
  <path d="M104 176 L280 86 L456 176 L432 176 L280 100 L128 176 Z" fill="url(#roofGrad)" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Roof ridge vent -->
  <path d="M254 96 L280 82 L306 96" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Architectural interior partition & floor -->
  <line x1="136" y1="336" x2="424" y2="336" stroke="#1E293B" stroke-width="2"/>
  <!-- Left ventilation window -->
  <rect x="132" y="208" width="8" height="68" rx="3" fill="#38BDF8" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.4"/>
  <!-- Right ventilation window -->
  <rect x="420" y="208" width="8" height="68" rx="3" fill="#14B8A6" fill-opacity="0.35" stroke="#14B8A6" stroke-width="1.4"/>

  <!-- Minimal interior furniture silhouette (compact living space) -->
  <!-- AC unit on upper wall -->
  <rect x="166" y="182" width="66" height="20" rx="5" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <line x1="176" y1="196" x2="222" y2="196" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="222" cy="189" r="2" fill="#10B981"/>

  <!-- Desk & chair silhouette -->
  <rect x="316" y="294" width="76" height="6" rx="2" fill="#263449"/>
  <rect x="324" y="300" width="4" height="36" fill="#1E293B"/>
  <rect x="380" y="300" width="4" height="36" fill="#1E293B"/>
  <!-- Small indoor plant -->
  <rect x="164" y="314" width="22" height="22" rx="4" fill="#1E293B" stroke="#334155"/>
  <path d="M175 314 C175 298 163 292 160 286 C168 288 174 295 175 304 C177 294 184 287 192 285 C188 294 179 300 175 314 Z" fill="#10B981" fill-opacity="0.65"/>

  <!-- Thermal Comfort Core Zone -->
  <circle cx="280" cy="252" r="56" fill="url(#comfortCore)"/>
  <circle cx="280" cy="252" r="34" stroke="#14B8A6" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 4"/>

  <!-- Airflow Streamlines (Cross-Ventilation) -->
  <path d="M84 234 C140 234, 174 212, 232 224 C290 236, 332 252, 396 232 C424 223, 448 222, 472 226" stroke="url(#airflow1)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M96 262 C156 266, 200 284, 266 270 C328 257, 368 242, 456 254" stroke="url(#airflow2)" stroke-width="2" stroke-linecap="round"/>
  <path d="M198 206 C204 226, 224 236, 250 242" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4" stroke-linecap="round"/>

  <!-- Central IoT Sensor Hub Node (Arduino MKR) -->
  <g transform="translate(260, 232)">
    <rect x="0" y="0" width="40" height="40" rx="11" fill="#0F172A" stroke="#14B8A6" stroke-width="1.8"/>
    <circle cx="20" cy="20" r="6" fill="#14B8A6"/>
    <circle cx="20" cy="20" r="12" stroke="#14B8A6" stroke-opacity="0.45" stroke-width="1.2"/>
  </g>

  <!-- 4 Clean Telemetry Node Badges (Iconic, Non-Cluttered) -->
  <!-- Temperature Node (Top-Left) -->
  <g transform="translate(52, 118)">
    <rect x="0" y="0" width="96" height="44" rx="10" fill="#0F1D30" stroke="#F97316" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="11" fill="#F97316" fill-opacity="0.16"/>
    <path d="M22 15 V24 M22 24 A3 3 0 1 0 22 30 A3 3 0 1 0 22 24" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round"/>
    <text x="41" y="19" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="600">SUHU</text>
    <text x="41" y="33" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">26.4°C</text>
  </g>
  <line x1="148" y1="144" x2="262" y2="238" stroke="#F97316" stroke-opacity="0.28" stroke-dasharray="3 4"/>

  <!-- Humidity Node (Top-Right) -->
  <g transform="translate(412, 118)">
    <rect x="0" y="0" width="96" height="44" rx="10" fill="#0F1D30" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="11" fill="#38BDF8" fill-opacity="0.16"/>
    <path d="M22 15 C22 15 17 21 17 24.5 C17 27.2 19.2 29 22 29 C24.8 29 27 27.2 27 24.5 C27 21 22 15 22 15 Z" stroke="#38BDF8" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="41" y="19" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="600">HUMID</text>
    <text x="41" y="33" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">62.0%</text>
  </g>
  <line x1="412" y1="144" x2="298" y2="238" stroke="#38BDF8" stroke-opacity="0.28" stroke-dasharray="3 4"/>

  <!-- Air Quality Node (Bottom-Left) -->
  <g transform="translate(48, 294)">
    <rect x="0" y="0" width="102" height="44" rx="10" fill="#0F1D30" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="11" fill="#10B981" fill-opacity="0.16"/>
    <path d="M16 25 H26 C28 25 28 21 25.5 21 C25 18.5 21.5 18 20 20 C17.5 20 16 22 16 25 Z" stroke="#34D399" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="41" y="19" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="600">CO₂</text>
    <text x="41" y="33" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">340 ppm</text>
  </g>
  <line x1="150" y1="312" x2="262" y2="266" stroke="#10B981" stroke-opacity="0.28" stroke-dasharray="3 4"/>

  <!-- Wind Speed Node (Bottom-Right) -->
  <g transform="translate(410, 294)">
    <rect x="0" y="0" width="102" height="44" rx="10" fill="#0F1D30" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="11" fill="#A78BFA" fill-opacity="0.16"/>
    <path d="M15 20 H25 C27 20 27 17 25 17 M15 24 H27 C29 24 29 27 27 27" stroke="#C4B5FD" stroke-width="1.7" stroke-linecap="round"/>
    <text x="41" y="19" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="600">ANGIN</text>
    <text x="41" y="33" fill="#F8FAFC" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1.4 m/s</text>
  </g>
  <line x1="410" y1="312" x2="298" y2="266" stroke="#A78BFA" stroke-opacity="0.28" stroke-dasharray="3 4"/>
</svg>
